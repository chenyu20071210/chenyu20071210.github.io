<!DOCTYPE html>
<html>
<head>
    <meta charset="utf-8">
    <title>Moving Car Animation</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        body {
            height: 100vh;
            background: #f0f0f0;
            position: relative;
            overflow: hidden;
        }
        /* 小车容器，负责左右移动动画 */
        .car {
            position: absolute;
            bottom: 100px;
            left: -200px;
            width: 200px;
            height: 80px;
            /* 无限循环移动动画：从左跑到右，再从右跑回左 */
            animation: moveCar 8s linear infinite;
        }
        /* 移动动画关键帧 */
        @keyframes moveCar {
            0% { left: -200px; }
            50% { left: calc(100vw - 0px); transform: scaleX(1); }
            51% { transform: scaleX(-1); }
            100% { left: -200px; transform: scaleX(-1); }
        }
        /* 小车车身（渐变，符合要求） */
        .car-body {
            width: 200px;
            height: 60px;
            background: linear-gradient(45deg, #ff6b6b, #ffd93d);
            border-radius: 10px 10px 0 0;
            border: 2px solid #333;
        }
        /* 小车车顶 */
        .car-top {
            width: 120px;
            height: 40px;
            background: linear-gradient(45deg, #4ecdc4, #44a08d);
            border-radius: 10px 10px 0 0;
            border: 2px solid #333;
            margin: 0 40px;
        }
        /* 车轮（带渐变，会跟着车跑） */
        .wheel {
            width: 40px;
            height: 40px;
            background: linear-gradient(45deg, #333, #666);
            border-radius: 50%;
            border: 3px solid #222;
            position: absolute;
            bottom: -20px;
            /* 车轮自己也会转，更真实 */
            animation: rotateWheel 1s linear infinite;
        }
        /* 车轮旋转动画 */
        @keyframes rotateWheel {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }
        .wheel-front { left: 30px; }
        .wheel-back { right: 30px; }
    </style>
</head>
<body>
    <div class="car">
        <div class="car-top"></div>
        <div class="car-body"></div>
        <div class="wheel wheel-front"></div>
        <div class="wheel wheel-back"></div>
    </div>
</body>
</html>
