<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <title>3D汉诺塔游戏</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
<div class="box">
    <h2>汉诺塔小游戏</h2>
    <div class="btn">
        <input type="number" id="num" value="3" min="3" max="8">
        <button id="reset">重新开始</button>
        <button id="auto">自动通关</button>
    </div>
    <p>移动次数：<span id="count">0</span></p >
    <p id="warn"></p >
    <div class="tower">
        <div class="col" id="a"></div>
        <div class="col" id="b"></div>
        <div class="col" id="c"></div>
    </div>
</div>
<script src="script.js"></script>
</body>
</html>
